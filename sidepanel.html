<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <title>Fleet Scraper</title>
</head>
<body>

  <div class="header">
    <h1>🚀 Fleet Scraper v3</h1>
    <div class="header-controls">
      <button id="btnStart" class="btn-start">Start</button>
      <button id="btnPause" class="btn-pause hidden">Pause</button>
      <button id="btnResume" class="btn-start hidden">Resume</button>
      <button id="btnStop" class="btn-stop">Stop</button>
    </div>
  </div>

  <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
  <div class="progress-text">
    <span id="progressLabel">Ready</span>
    <span id="progressPercent">0%</span>
  </div>

  <div class="main-layout">
    
    <div class="config-panel">
      <div>
        <label>Vehicle ID & Number Mapping (Format: ID [Tab] VehicleNo)</label>
        <textarea id="mappingInput" placeholder="473	DHM-AU-11-5902&#10;474	DHM-AU-11-5903"></textarea>
      </div>
      <div class="config-row">
        <label style="margin:0; flex:1;">Max Concurrent Tabs:</label>
        <input type="number" id="maxTabs" value="2" min="1" max="10">
        <button id="btnSaveMapping" style="background:var(--accent); color:#000; border:none;">Save Config</button>
      </div>
    </div>

    <div class="split-view">
      <div class="panel-header">
        <span>📊 Data Preview</span>
        <div class="actions">
          <button id="btnExportCSV">CSV</button>
          <button id="btnExportJSON">JSON</button>
          <button id="btnClearData" style="color:var(--danger); border-color:var(--danger);">Clear</button>
        </div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Vehicle No</th>
              <th>ID</th>
              <th>Model</th>
              <th>Hub</th>
              <th>Fuel</th>
              <th>Coords</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody id="dataTableBody">
            <tr><td colspan="7" style="text-align:center; padding:10px; color:#555;">No data scraped yet.</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="split-view">
      <div class="panel-header">
        <span>📜 Console Logs</span>
      </div>
      <div id="logContainer" class="log-container">
        <div>[System] Waiting for commands...</div>
      </div>
    </div>

  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
